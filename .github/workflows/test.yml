name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Run the test suite ────────────────────────────────────────────────────
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    # Spin up a local Postgres — much faster than hitting a cloud DB
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       fintrack_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # All "run" steps execute inside fintrack_backend/
    defaults:
      run:
        working-directory: fintrack_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fintrack_backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY:           "ci-only-secret-key-not-used-in-production"
          DEBUG:                "True"
          DATABASE_URL:         "postgresql://postgres:postgres@localhost:5432/fintrack_test"
          ALLOWED_HOSTS:        "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:5173"
        run: python -m pytest --tb=short -q

  # ── 2. Deploy to Render (only on green push to main) ─────────────────────────
  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
