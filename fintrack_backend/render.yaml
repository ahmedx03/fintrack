services:
  - type: web
    name: fintrack-api
    env: python
    region: oregon
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >
      python manage.py migrate &&
      gunicorn config.wsgi --log-file -
    healthCheckPath: /api/auth/me/
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
